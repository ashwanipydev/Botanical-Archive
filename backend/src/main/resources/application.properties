spring.application.name=backend
server.port=${PORT:8081}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:zoo_db}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${PGUSER:zoo_admin}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${PGPASSWORD:zoo_password}}
spring.datasource.driver-class-name=org.postgresql.Driver

# Use Flyway migrations (no JPA/Hibernate)
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.repair-on-migrate=true

# CORS (comma-separated origin patterns)
app.cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:3000}

# JWT configuration
jwt.secret=${JWT_SECRET:ZooBookingSystemSecretKeyChangeInProduction2026!@#}
jwt.expirationMs=86400000

# Swagger/OpenAPI Configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.show-extensions=true

# Email Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Thymeleaf Configuration for Email Templates
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.cache=false

# Logging Configuration
logging.level.root=INFO
logging.level.com.zoo.booking.security=DEBUG
logging.level.com.zoo.booking.controller=DEBUG
logging.level.org.springframework.security=INFO

# Razorpay Configuration
razorpay.key.id=${RAZORPAY_KEY_ID:rzp_test_SfGiUOcNjRoxdo}
razorpay.key.secret=${RAZORPAY_KEY_SECRET:AOEqnVYTACFltAzwFvi0v0an}
