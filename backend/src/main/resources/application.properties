spring.application.name=backend
server.port=${PORT:8081}

spring.datasource.url=jdbc:postgresql://localhost:5432/zoo_db
spring.datasource.username=zoo_admin
spring.datasource.password=zoo_password
spring.datasource.driver-class-name=org.postgresql.Driver

# Use Flyway migrations (no JPA/Hibernate)
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.repair-on-migrate=true

# CORS (comma-separated origin patterns)
app.cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:3000}

# JWT configuration
jwt.secret=${JWT_SECRET:ZooBookingSystemSecretKeyChangeInProduction2026!@#}
jwt.expirationMs=86400000

# Swagger/OpenAPI Configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.show-extensions=true

